<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        토너먼트 기록 | FC Online Champions League
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css?v=tournament-history-1"
    >
</head>


<body>

<header>
    <div class="header-container">

        <div class="logo">
            <a href="./index.html">

                <span class="logo-title">
                    FCL
                </span>

                <span class="logo-bottom">

                    <span class="logo-line"></span>

                    <span class="logo-season">
                        SEASON 1
                    </span>

                    <span class="logo-line"></span>

                </span>

            </a>
        </div>


        <nav>
            <ul class="main-menu"></ul>
        </nav>

    </div>
</header>


<main class="tournament-history-page">

    <section class="tournament-record-section">

        <div class="tournament-record-page-header">

            <h1>
                토너먼트 기록
            </h1>

            <p>
                완료된 원데이 토너먼트의
                대진과 우승 기록을 확인할 수 있습니다.
            </p>

        </div>


        <div
            class="tournament-record-list"
            id="tournament-record-list"
        >
        </div>


        <section
            class="tournament-record-detail hidden"
            id="tournament-record-detail"
        >

            <div
                class="tournament-record-detail-header"
            >

                <div>

                    <span
                        id="tournament-record-date"
                        class="tournament-record-date"
                    >
                    </span>

                    <h2
                        id="tournament-record-title"
                    >
                    </h2>

                    <p
                        id="tournament-record-info"
                    >
                    </p>

                </div>


                <div
                    class="tournament-record-champion"
                    id="tournament-record-champion"
                >
                </div>

            </div>


            <div
                class="tournament-record-bracket"
                id="tournament-record-bracket"
            >
            </div>

        </section>

    </section>

</main>


<footer id="site-footer"></footer>


<script
    type="module"
    src="./js/tournament-history.js?v=tournament-history-1"
></script>

<script src="./js/site-nav.js"></script>

</body>

</html>
