<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>선수 기록 | FC Online Champions League</title>

    <link rel="stylesheet" href="./css/style.css">
</head>



<header>
    <div class="header-container">

        <!-- 로고 영역 -->
        <div class="logo">
            <a href="./index.html">
                <span class="logo-title">FCL</span>

                <span class="logo-bottom">
                    <span class="logo-line"></span>
                    <span class="logo-season">SEASON 1</span>
                    <span class="logo-line"></span>
                </span>
            </a>
        </div>

        <!-- 네비게이션 영역 -->
        <nav>
            <ul class="main-menu">

                <!-- 경기 메뉴 -->
                <li class="menu-item">
                    <a href="#">경기</a>

                    <ul class="sub-menu">
                        <li><a href="./schedule.html">경기 일정</a></li>
                        <li><a href="./results.html">경기 결과</a></li>
                        <li><a href="./rules.html">경기 규칙</a></li>
                    </ul>
                </li>

                <!-- 기록 메뉴 -->
                <li class="menu-item">
                    <a href="#">기록</a>

                    <ul class="sub-menu">
                        <li><a href="./standings.html">팀 기록</a></li>
                        <li><a href="./players.html">선수 기록</a></li>
                    </ul>
                </li>

                <!-- 커뮤니티 메뉴 -->
                <li class="menu-item">
                    <a href="#">커뮤니티</a>

                    <ul class="sub-menu">
                        <li>
                            <a href="./preseason.html">
                                친선전 예약
                            </a>
                        </li>
                    </ul>
                </li>

            </ul>
        </nav>

    </div>
</header>


<main class="players-page">

    <section class="players-section">

        <div class="players-header">
            <h1>FCL 선수 순위</h1>
            <p>
                FC Online Champions League 정규리그 선수 누적 기록
            </p>
        </div>

        <div class="players-table-container">

            <table class="players-table">

                <colgroup>
                    <col class="player-col-rank">
                    <col class="player-col-name">
                    <col class="player-col-owner">
                    <col class="player-col-goals">
                    <col class="player-col-assists">
                    <col class="player-col-sets">
                    <col class="player-col-rating">
                    <col class="player-col-mvp">
                </colgroup>


                <thead>
                    <tr>
                        <th>순위</th>

                        <th
                            class="player-sort-header"
                            data-sort-key="player_name"
                        >
                            선수
                            <span class="player-sort-arrow"></span>
                        </th>

                        <th
                            class="player-sort-header"
                            data-sort-key="fcl_name"
                        >
                            FCL 참가자
                            <span class="player-sort-arrow"></span>
                        </th>

                        <th
                            class="player-sort-header"
                            data-sort-key="goals"
                        >
                            득점
                            <span class="player-sort-arrow"></span>
                        </th>

                        <th
                            class="player-sort-header"
                            data-sort-key="assists"
                        >
                            도움
                            <span class="player-sort-arrow"></span>
                        </th>

                        <th
                            class="player-sort-header"
                            data-sort-key="sets_played"
                        >
                            출전
                            <span class="player-sort-arrow"></span>
                        </th>

                        <th
                            class="player-sort-header"
                            data-sort-key="mvp_count"
                        >
                            MVP
                            <span class="player-sort-arrow"></span>
                        </th>

                        <th
                            class="player-sort-header"
                            data-sort-key="average_rating"
                        >
                            평균 평점
                            <span class="player-sort-arrow"></span>
                        </th>
                    </tr>
                </thead>


                <tbody class="players-table-body">

                </tbody>

            </table>

        </div>

    </section>

</main>

<!-- 하단 영역 -->
<footer>
    <p>V1.0 FCL Created by aria</p>
</footer>

<script type="module" src="./js/players.js"></script>
<script src="./js/site-nav.js"></script>

</body>
</html>
