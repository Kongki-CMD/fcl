<main class="photo-request-write-page">

    <section class="photo-request-write-header">

        <h1>
            선수 사진 요청
        </h1>

        <p>
            변경을 원하는 선수와 참고 이미지를 등록해주세요.
        </p>

    </section>


    <form
        id="photo-request-write-form"
        class="community-write-form"
    >

        <div class="community-form-field">

            <label for="photo-request-player-name">
                선수명
            </label>

            <input
                type="text"
                id="photo-request-player-name"
                maxlength="100"
                placeholder="예: A. 우에다"
                required
            >

        </div>


        <div class="community-form-field">

            <label for="photo-request-season-name">
                시즌명
            </label>

            <input
                type="text"
                id="photo-request-season-name"
                maxlength="100"
                placeholder="예: 25TOTS"
            >

        </div>


        <div class="community-form-field">

            <label for="photo-request-sp-id">
                sp_id
            </label>

            <input
                type="number"
                id="photo-request-sp-id"
                min="1"
                step="1"
                placeholder="알고 있는 경우에만 입력"
            >

            <p class="community-image-help">
                모르면 비워둬도 됩니다.
            </p>

        </div>


        <div class="community-form-field">

            <label for="photo-request-author">
                작성자 닉네임
            </label>

            <input
                type="text"
                id="photo-request-author"
                maxlength="100"
                placeholder="사용할 닉네임을 입력해주세요."
                required
            >

        </div>


        <div class="community-form-field">

            <label for="photo-request-password">
                비밀번호
            </label>

            <input
                type="password"
                id="photo-request-password"
                minlength="4"
                maxlength="50"
                placeholder="수정/삭제에 사용할 비밀번호"
                required
            >

        </div>


        <div class="community-form-field">

            <label for="photo-request-content">
                요청 내용
            </label>

            <textarea
                id="photo-request-content"
                rows="10"
                placeholder="어떤 사진으로 변경을 원하는지 작성해주세요."
                required
            ></textarea>

        </div>


        <div class="community-form-field">

            <label for="photo-request-images">
                참고 이미지
            </label>

            <input
                type="file"
                id="photo-request-images"
                accept="image/jpeg,image/png,image/webp,image/gif"
                multiple
            >

            <p class="community-image-help">
                최대 5장 · 이미지당 최대 5MB
            </p>

            <div
                id="photo-request-image-list"
                class="community-image-list"
            ></div>

        </div>


        <p
            id="photo-request-write-message"
            class="community-write-message"
        ></p>


        <div class="community-write-actions">

            <a
                href="./player-photo-request.html"
                class="community-cancel-button"
            >
                취소
            </a>


            <button
                type="submit"
                class="community-submit-button"
            >
                요청 등록
            </button>

        </div>

    </form>
