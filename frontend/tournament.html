<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        원데이 토너먼트 | FC Online Champions League
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css?v=tournament-1"
    >
</head>


<body>

<header>
    <div class="header-container">

        <div class="logo">
            <a href="./index.html">

                <span class="logo-title">
                    FCL
                </span>

                <span class="logo-bottom">

                    <span class="logo-line"></span>

                    <span class="logo-season">
                        SEASON 1
                    </span>

                    <span class="logo-line"></span>

                </span>

            </a>
        </div>


        <nav>
            <ul class="main-menu"></ul>
        </nav>

    </div>
</header>


<main class="tournament-page">

    <section class="tournament-section">

        <div class="tournament-page-header">

            <div>
                <h1>
                    원데이 토너먼트
                </h1>

                <p>
                    참가자를 직접 입력하고
                    하루 안에 진행할 토너먼트 대진을 생성합니다.
                </p>
            </div>

        </div>


        <!-- 토너먼트 생성 -->
        <section
            class="tournament-create-panel"
            id="tournament-create-panel"
        >

            <h2>
                새 토너먼트
            </h2>


            <label class="tournament-field">

                <span>
                    대회명
                </span>

                <input
                    type="text"
                    id="tournament-title"
                    maxlength="100"
                    placeholder="예: 토요일 번개컵"
                >

            </label>


            <div class="tournament-participant-header">

                <span>
                    참가자
                </span>

                <span
                    id="tournament-participant-count"
                >
                    2 / 16명
                </span>

            </div>


            <div
                class="tournament-participant-list"
                id="tournament-participant-list"
            >
            </div>


            <button
                type="button"
                id="tournament-add-participant"
                class="tournament-secondary-button"
            >
                + 참가자 추가
            </button>


            <label class="tournament-random-option">

                <input
                    type="checkbox"
                    id="tournament-randomize"
                    checked
                >

                <span>
                    대진 랜덤 섞기
                </span>

            </label>


            <button
                type="button"
                id="tournament-create-button"
                class="tournament-primary-button"
            >
                토너먼트 생성
            </button>


            <p
                class="tournament-form-message"
                id="tournament-form-message"
            >
            </p>

        </section>


        <!-- 생성된 토너먼트 목록 -->
        <section class="tournament-history-panel">

            <div class="tournament-history-header">

                <h2>
                    토너먼트 목록
                </h2>

                <button
                    type="button"
                    id="tournament-new-button"
                    class="tournament-secondary-button"
                >
                    새 토너먼트 만들기
                </button>

            </div>


            <div
                class="tournament-history-list"
                id="tournament-history-list"
            >
            </div>

        </section>


        <!-- 대진표 -->
        <section
            class="tournament-bracket-panel hidden"
            id="tournament-bracket-panel"
        >

            <div class="tournament-bracket-header">

                <div>

                    <span
                        class="tournament-bracket-date"
                        id="tournament-bracket-date"
                    >
                    </span>

                    <h2
                        id="tournament-bracket-title"
                    >
                    </h2>

                    <p
                        id="tournament-bracket-info"
                    >
                    </p>

                </div>


                <div
                    class="tournament-champion hidden"
                    id="tournament-champion"
                >
                </div>

            </div>


            <div
                class="tournament-bracket"
                id="tournament-bracket"
            >
            </div>

        </section>

    </section>

</main>

<!-- 경기 상세 모달 -->
<div
    id="result-detail-modal"
    class="result-detail-modal hidden"
    aria-hidden="true"
    inert
>

    <div
        class="result-detail-backdrop"
        data-result-detail-close
    ></div>


    <section
        class="result-detail-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="result-detail-title"
    >

        <div class="result-detail-header">

            <h2 id="result-detail-title">
                경기 상세
            </h2>


            <button
                type="button"
                class="result-detail-close-button"
                data-result-detail-close
                aria-label="경기 상세 닫기"
            >
                ×
            </button>

        </div>


        <div
            id="result-detail-content"
            class="result-detail-content"
        >
        </div>

    </section>

</div>


<footer id="site-footer"></footer>


<script
    type="module"
    src="./js/tournament.js?v=tournament-1"
></script>

<script src="./js/site-nav.js"></script>

</body>

</html>
