<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>경기 결과 | FC Online Champions League</title>

        <link rel="stylesheet" href="./css/style.css">
    </head>

    <body>

<header>
    <div class="header-container">

        <!-- 로고 영역 -->
        <div class="logo">
            <a href="./index.html">
                <span class="logo-title">FCL</span>

                <span class="logo-bottom">
                    <span class="logo-line"></span>
                    <span class="logo-season">SEASON 1</span>
                    <span class="logo-line"></span>
                </span>
            </a>
        </div>

        <!-- 네비게이션 영역 -->
        <nav>
            <ul class="main-menu">

                <!-- 경기 메뉴 -->
                <li class="menu-item">
                    <a href="#">경기</a>

                    <ul class="sub-menu">
                        <li><a href="./schedule.html">경기 일정</a></li>
                        <li><a href="./results.html">경기 결과</a></li>
                        <li><a href="./rules.html">경기 규칙</a></li>
                    </ul>
                </li>

                <!-- 기록 메뉴 -->
                <li class="menu-item">
                    <a href="#">기록</a>

                    <ul class="sub-menu">
                        <li><a href="./standings.html">팀 기록</a></li>
                        <li><a href="./players.html">선수 기록</a></li>
                    </ul>
                </li>

                <!-- 커뮤니티 메뉴 -->
                <li class="menu-item">
                    <a href="#">커뮤니티</a>

                    <ul class="sub-menu">
                        <li>
                            <a href="./preseason.html">
                                친선전 예약
                            </a>
                        </li>
                    </ul>
                </li>

            </ul>
        </nav>

    </div>
</header>

        <!-- 메인 영역 -->
        <main class="results-page">

            <section class="results-section">

                <div class="results-header">
                    <h1>경기 결과</h1>
                    <p>FC Online Champions League 경기 결과</p>
                </div>

                <div class="results-admin-bar">

                    <button
                        type="button"
                        id="admin-mode-button"
                        class="admin-mode-button"
                    >
                        관리자 모드
                    </button>


                    <span
                        id="admin-status"
                        class="admin-status hidden"
                    >
                        관리자 모드 ON
                    </span>


                    <button
                        type="button"
                        id="admin-logout-button"
                        class="admin-logout-button hidden"
                    >
                        관리자 종료
                    </button>

                </div>


                <div
                    id="admin-login-modal"
                    class="admin-login-modal hidden"
                >

                    <form
                        id="admin-login-form"
                        class="admin-login-panel"
                    >

                        <h3>
                            관리자 로그인
                        </h3>


                        <input
                            type="password"
                            id="admin-password-input"
                            placeholder="관리자 비밀번호"
                            autocomplete="current-password"
                        >


                        <p
                            id="admin-login-message"
                            class="admin-login-message"
                        ></p>


                        <div class="admin-login-actions">

                            <button
                                type="button"
                                id="admin-login-cancel-button"
                            >
                                취소
                            </button>


                            <button
                                type="submit"
                                id="admin-login-submit-button"
                            >
                                로그인
                            </button>

                        </div>

                    </form>

                </div>

                <div
                    id="result-edit-modal"
                    class="admin-login-modal hidden"
                >

                    <form
                        id="result-edit-form"
                        class="result-edit-panel"
                    >

                        <h3>
                            경기 결과 수정
                        </h3>


                        <p
                            id="result-edit-title"
                            class="result-edit-title"
                        ></p>


                        <div class="result-edit-set">

                            <span>1세트</span>

                            <input
                                type="number"
                                min="0"
                                id="edit-set1-team-a"
                            >

                            <span>:</span>

                            <input
                                type="number"
                                min="0"
                                id="edit-set1-team-b"
                            >

                        </div>


                        <div class="result-edit-set">

                            <span>2세트</span>

                            <input
                                type="number"
                                min="0"
                                id="edit-set2-team-a"
                            >

                            <span>:</span>

                            <input
                                type="number"
                                min="0"
                                id="edit-set2-team-b"
                            >

                        </div>


                        <div class="result-edit-set">

                            <span>3세트</span>

                            <input
                                type="number"
                                min="0"
                                id="edit-set3-team-a"
                            >

                            <span>:</span>

                            <input
                                type="number"
                                min="0"
                                id="edit-set3-team-b"
                            >

                        </div>


                        <p
                            id="result-edit-message"
                            class="admin-login-message"
                        ></p>


                        <div class="admin-login-actions">

                            <button
                                type="button"
                                id="result-edit-cancel-button"
                            >
                                취소
                            </button>

                            <button
                                type="submit"
                                id="result-edit-save-button"
                            >
                                수정 완료
                            </button>

                        </div>

                    </form>

                </div>

                <div class="results-list">

                </div>

            </section>

        </main>

<!-- 하단 영역 -->
<footer>
    <p>V1.0 FCL Created by aria</p>
</footer>

        <script type="module" src="./js/results.js"></script>
    </body>
</html>
