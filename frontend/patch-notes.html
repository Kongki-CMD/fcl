<!DOCTYPE html>

<html lang="ko">

<head>

    <meta

        content="width=device-width, initial-scale=1.0"

    <title>

    <link

        href="./css/style.css"

</head>


<body>

<header>
    <div class="header-container">

        <!-- 로고 영역 -->
        <div class="logo">
            <a href="./index.html">

                <span class="logo-title">
                    FCL
                </span>

                <span class="logo-bottom">

                    <span class="logo-line"></span>

                    <span class="logo-season">

        <nav>

        </nav>

    </div>

        <!-- 패치노트 카드 -->
        <div
            class="patch-note-list"
            id="patch-note-list"

    </section>

<!-- 공통 Footer -->
<footer id="site-footer"></footer>


<script src="./js/site-nav.js"></script>
