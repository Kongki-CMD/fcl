<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

    </title>

    <link
        rel="stylesheet"
        href="./css/style.css?v=ai-history-1"
    >
</head>


<body>

<header>
    <div class="header-container">

        <div class="logo">
            <a href="./index.html">

                <span class="logo-title">
                    FCL
                </span>

                <span class="logo-bottom">

                    <span class="logo-line"></span>

                    <span class="logo-season">
                        SEASON 1
                    </span>

                    <span class="logo-line"></span>

                </span>

            </a>
        </div>


        <nav>
            <ul class="main-menu">

                <li class="menu-item">
                    <a href="#">
                        경기
                    </a>

                    <ul class="sub-menu">
                        <li>
                            <a href="./schedule.html">
                                경기 일정
                            </a>
                        </li>

                        <li>
                            <a href="./results.html">
                                경기 결과
                            </a>
                        </li>

                        <li>
                            <a href="./rules.html">
                                경기 규칙
                            </a>
                        </li>
                    </ul>
                </li>


                <li class="menu-item">
                    <a href="#">
                        기록
                    </a>

                    <ul class="sub-menu">

                        <li>
                            <a href="./standings.html">
                                팀 기록
                            </a>
                        </li>

                        <li>
                            <a href="./players.html">
                                선수 기록
                            </a>
                        </li>

                        <li>
                            <a href="./ai-predictions.html">
                                AI 예측 기록
                            </a>
                        </li>

                    </ul>
                </li>

            </ul>
        </nav>

    </div>
</header>


<main class="ai-history-page">

    <section class="ai-history-section">

        <div class="ai-history-header">

            <h1>
                AI 예측 기록
            </h1>

            <p>
                경기 시작 시점에 저장된 AI 예측과
                실제 정규리그 결과를 비교합니다.
            </p>

        </div>


        <div class="ai-history-summary">

            <article class="ai-summary-card">

                <span class="ai-summary-label">
                    경기 예측
                </span>

                <strong
                    class="ai-summary-value"
                    id="ai-series-accuracy"
                >
                    -
                </strong>

                <span
                    class="ai-summary-detail"
                    id="ai-series-detail"
                >
                    기록 없음
                </span>

            </article>


            <article class="ai-summary-card">

                <span class="ai-summary-label">
                    SET 예측
                </span>

                <strong
                    class="ai-summary-value"
                    id="ai-set-accuracy"
                >
                    -
                </strong>

                <span
                    class="ai-summary-detail"
                    id="ai-set-detail"
                >
                    기록 없음
                </span>

            </article>


            <article class="ai-summary-card">

                <span class="ai-summary-label">
                    경기 Brier
                </span>

                <strong
                    class="ai-summary-value"
                    id="ai-series-brier"
                >
                    -
                </strong>

                <span class="ai-summary-detail">
                    낮을수록 좋음
                </span>

            </article>


            <article class="ai-summary-card">

                <span class="ai-summary-label">
                    SET Brier
                </span>

                <strong
                    class="ai-summary-value"
                    id="ai-set-brier"
                >
                    -
                </strong>

                <span class="ai-summary-detail">
                    낮을수록 좋음
                </span>

            </article>

        </div>


        <div
            class="ai-history-empty"
            id="ai-history-empty"
            hidden
        >
            <strong>
                아직 AI 실전 예측 기록이 없습니다.
            </strong>

            <p>
                AI Snapshot이 저장된 정규리그가
                완료되면 자동으로 기록됩니다.
            </p>
        </div>


        <div
            class="ai-history-list"
            id="ai-history-list"
        ></div>

    </section>

</main>


<footer id="site-footer"></footer>


<script
    type="module"
    src="./js/ai-predictions.js?v=ai-history-1"
></script>

<script src="./js/site-nav.js"></script>

</body>

</html>
