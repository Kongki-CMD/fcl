<main class="community-write-page">

    <section class="community-write-header">

        <h1>
            자유게시판 글쓰기
        </h1>

        <p>
            FCL 참가자들과 자유롭게 이야기를 나눠보세요.
        </p>

    </section>


    <form
        id="community-write-form"
        class="community-write-form"
    >

        <div class="community-form-field">

            <label for="community-title">
                제목
            </label>

            <input
                type="text"
                id="community-title"
                maxlength="200"
                placeholder="제목을 입력해주세요."
                required
            >

        </div>


        <div class="community-form-field">

            <label for="community-author">
                작성자 닉네임
            </label>

            <input
                type="text"
                id="community-author"
                maxlength="100"
                placeholder="사용할 닉네임을 입력해주세요."
                required
            >

        </div>

        <div class="community-form-field">

            <label for="community-password">
                비밀번호
            </label>

            <input
                type="password"
                id="community-password"
                minlength="4"
                maxlength="50"
                placeholder="수정/삭제에 사용할 비밀번호"
                required
            >

        </div>


        <div class="community-form-field">

            <label for="community-content">
                내용
            </label>

            <textarea
                id="community-content"
                rows="12"
                placeholder="내용을 입력해주세요."
                required
            ></textarea>

        </div>


        <div class="community-form-field">

            <label for="community-images">
                이미지 첨부
            </label>

            <input
                type="file"
                id="community-images"
                accept="image/jpeg,image/png,image/webp,image/gif"
                multiple
            >

            <p class="community-image-help">
                최대 5장 · 이미지당 최대 5MB
            </p>

            <div
                id="community-image-list"
                class="community-image-list"
            ></div>

        </div>


        <p
            id="community-write-message"
            class="community-write-message"
        ></p>


        <div class="community-write-actions">

            <a
                href="./community.html"
                class="community-cancel-button"
            >
                취소
            </a>


            <button
                type="submit"
                class="community-submit-button"
            >
                등록
            </button>

        </div>

    </form>
